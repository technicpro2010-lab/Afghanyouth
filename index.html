<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>JAVELS — Multilingual Life, Business & Education Support in Japan</title>
    <meta
      name="title"
      content="JAVELS — Multilingual Life, Business & Education Support in Japan"
    />
    <meta
      name="description"
      content="JAVELS is a trusted multilingual support platform in Japan helping foreign residents, families, and entrepreneurs with housing, banking, visas, company setup, tax advisory, and education."
    />
    <meta
      name="keywords"
      content="Japan visa support, living in Japan, moving to Japan, Japan company setup, multilingual support Japan, foreigner housing Japan, JAVELS, Japan consultation"
    />
    <meta name="author" content="JAVELS" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://javels.jp/" />

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://javels.jp/" />
    <meta property="og:title" content="JAVELS — Multilingual Life, Business & Education Support in Japan" />
    <meta
      property="og:description"
      content="Comprehensive multilingual assistance for foreigners in Japan: daily settlement, visa assistance, business registration, tax coordination, and Japanese education."
    />
    <meta property="og:image" content="https://javels.jp/og-image.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:site_name" content="JAVELS" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://javels.jp/" />
    <meta name="twitter:title" content="JAVELS — Multilingual Life, Business & Education Support in Japan" />
    <meta
      name="twitter:description"
      content="Multilingual support and consultation for foreign residents, entrepreneurs, and families in Japan."
    />
    <meta name="twitter:image" content="https://javels.jp/og-image.jpg" />

    <!-- Geographic & Regional Tags for Local SEO -->
    <meta name="geo.region" content="JP-12" />
    <meta name="geo.placename" content="Chiba, Japan" />

    <!-- Structured Data: JSON-LD for LocalBusiness / ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "JAVELS",
        "description": "Multilingual life, business, and education platform in Japan providing practical coordination and consultation with licensed professionals.",
        "url": "https://javels.jp/",
        "logo": "https://javels.jp/favicon.jpg",
        "image": "https://javels.jp/og-image.jpg",
        "telephone": "+81-70-3791-9654",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Chiba",
          "addressCountry": "JP"
        },
        "priceRange": "¥3000 - ¥5000",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday"
          ],
          "opens": "09:00",
          "closes": "18:00"
        },
        "knowsLanguage": ["en", "ja"],
        "sameAs": [
          "https://wa.me/+817037919654"
        ]
      }
    </script>

    <!-- Structured Data: FAQ Schema for Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What services does JAVELS offer in Japan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "JAVELS provides 3 pillars of support: Life (housing, banking, daily living), Business (visas, company formation, taxes), and Education (Japanese lessons, educational guidance)."
            }
          },
          {
            "@type": "Question",
            "name": "How are legal, tax, and regulated services handled?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Regulated and specialized legal or tax tasks are handled in collaboration with licensed administrative scriveners, judicial scriveners, certified tax accountants, and real estate professionals."
            }
          },
          {
            "@type": "Question",
            "name": "How can I book a consultation with JAVELS?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can book a 1-on-1 consultation directly on our website starting from ¥3,000 for Life or Education, or ¥5,000 for Business advisory."
            }
          }
        ]
      }
    </script>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
